<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EzyCore — variantes</title>
<style>
body{margin:0;padding:32px;background:#f5f3ee;color:#252d30;font:16px system-ui,sans-serif}h1{font-size:24px;margin:0 0 8px}button{padding:8px 16px;border:1px solid #ccc;background:white;border-radius:6px;cursor:pointer}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:24px}article{padding:24px;border:1px solid #ddd;border-radius:12px;background:white}article>img{width:100%;height:300px;object-fit:contain}.sizes{display:flex;gap:20px;align-items:center;height:300px;justify-content:center}small{display:block;margin-top:12px;color:#777}.dark article{background:#252d30}.dark h2,.dark small{color:#eee}.dark article:nth-child(3){background:#cbd2d4}.dark-logo{background:#252d30}.dark-logo h2{color:#eee}h2{font-size:16px;font-weight:600}@media(max-width:700px){section{grid-template-columns:1fr}}
</style>
<h1>EzyCore</h1>
<p>Logo a color, versión para fondo oscuro, variante monocromática y favicon con la mascota completa.</p>
<button onclick="document.body.classList.toggle('dark')">Cambiar fondo</button>
<section>
<article><h2>Color · fondo transparente</h2><img src="ezycore-color.png" alt="Logo EzyCore a color"></article>
<article class="dark-logo"><h2>Color · para fondo oscuro</h2><img src="ezycore-dark.png" alt="Logo EzyCore con personaje azul y texto claro y naranja para fondo oscuro"></article>
<article><h2>Monocromático · fondo transparente</h2><img src="ezycore-mono.png" alt="Logo EzyCore monocromático"></article>
<article><h2>Favicon · 16 / 32 / 64 px</h2><div class="sizes"><img src="favicon.svg" width="16" height="16" alt="Icono de 16 píxeles"><img src="favicon.svg" width="32" height="32" alt="Icono de 32 píxeles"><img src="favicon.svg" width="64" height="64" alt="Icono de 64 píxeles"></div><small>SVG, PNG e ICO. La mascota completa, sin texto, en tamaños pequeños.</small></article>
</section>
</html>
